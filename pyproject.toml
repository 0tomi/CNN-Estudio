[project]
name = "cnn-estudio"
version = "0.1.0"
description = "Laboratorio local de CNN para estudiar con experimentos reales"
requires-python = ">=3.12,<3.14"
dependencies = ["torch>=2.6,<3", "torchvision>=0.21,<1", "streamlit>=1.42,<2", "plotly>=6,<7", "scikit-learn>=1.6,<2", "pandas>=2.2,<3", "pytest>=8,<10"]

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
torchvision = { index = "pytorch-cpu" }

[tool.pytest.ini_options]
pythonpath = ["."]
